name: CI/CD Pipeline
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Build executable
        run: swift build -c release --arch ${{ matrix.arch }}
      - name: Build app bundle
        run: Scripts/build-app.sh .build/${{ matrix.arch }}/release/MacCJKVInputSwitcher dist/${{ matrix.arch }}/MacCJKVInputSwitcher.app
      - name: Verify bundle
        run: |
          test -x dist/${{ matrix.arch }}/MacCJKVInputSwitcher.app/Contents/MacOS/MacCJKVInputSwitcher
          plutil -lint dist/${{ matrix.arch }}/MacCJKVInputSwitcher.app/Contents/Info.plist
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.arch }}
          path: dist/${{ matrix.arch }}/MacCJKVInputSwitcher.app
  quality-gate:
    if: always()
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"
  release:
    if: startsWith(github.ref, "refs/tags/v")
    needs: [quality-gate]
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: app-*
          path: dist
      - name: Assemble Universal app
        run: |
          mv dist/app-arm64 dist/arm64
          mv dist/app-x86_64 dist/x86_64
          Scripts/build-universal.sh dist/MacCJKVInputSwitcher.app
      - name: Sign app
        env:
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
        run: |
          test -n "$APPLE_DEVELOPER_ID"
          codesign --force --options runtime --sign "$APPLE_DEVELOPER_ID" dist/MacCJKVInputSwitcher.app
      - name: Package DMG
        run: Scripts/package-dmg.sh dist/MacCJKVInputSwitcher.app "${GITHUB_REF_NAME#v}"
      - name: Verify package
        run: |
          codesign --verify --deep --strict dist/MacCJKVInputSwitcher.app
          spctl --assess --type execute dist/MacCJKVInputSwitcher.app
          shasum -a 256 dist/MacCJKVInputSwitcher-*.dmg > dist/SHA256SUMS
      - name: Generate Homebrew Cask
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA256=$(awk '{print $1}' dist/SHA256SUMS)
          Scripts/generate-cask.sh "$VERSION" "$SHA256" dist/mac-cjkv-input-switcher.rb
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/MacCJKVInputSwitcher-*.dmg dist/SHA256SUMS dist/mac-cjkv-input-switcher.rb --generate-notes
      - name: Update Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: tinyrack-net/homebrew-tap
          path: homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - name: Commit Homebrew Cask
        run: |
          cp dist/mac-cjkv-input-switcher.rb homebrew-tap/Casks/mac-cjkv-input-switcher.rb
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/mac-cjkv-input-switcher.rb
          git commit -m "Update mac-cjkv-input-switcher to $GITHUB_REF_NAME" || echo "No Cask changes"
          git push
